<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Оплата не завершена — SONYA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f5f5f5;
      background:
        radial-gradient(circle at 20% 20%, #303030 0, transparent 38%),
        radial-gradient(circle at 80% 80%, #181818 0, transparent 42%),
        #070707;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(520px, 100%);
      padding: 40px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 24px;
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(18px);
      text-align: center;
    }
    h1 { margin: 0 0 16px; font-size: 32px; }
    p { margin: 0 0 28px; color: #bdbdbd; line-height: 1.55; }
    a {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 999px;
      color: #080808;
      background: #f2f2f2;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Оплата не завершена</h1>
    <p>Платёж был отменён или не прошёл. Списание не подтверждено.</p>
    <a href="/">Вернуться в SONYA</a>
  </main>
</body>
</html>
