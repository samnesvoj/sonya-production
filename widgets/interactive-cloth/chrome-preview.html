<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SONYA Chrome — interactive-cloth (production-track) preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&family=Unbounded:wght@200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050505;
      }
      body[data-theme='light'] { background: #e9ebee; }
      #sonya-cloth-root { position: fixed; inset: 0; z-index: 1; }

      /* ── processing-screen overlay — copied 1:1 (values untouched) from
         the real .app-container.v2 .processing-title/-status/-progress
         rules in /styles.css, same as the approved holocloth-faithful
         chrome pass (sonya-processing-chrome.html). ── */
      .proc-overlay {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        text-align: center;
        padding: 40px 24px;
      }
      .proc-title {
        font-family: 'Unbounded', 'Sora', system-ui, sans-serif;
        font-weight: 300;
        font-size: clamp(26px, 6.5vw, 42px);
        letter-spacing: 0.1em;
        color: #fff;
        text-transform: uppercase;
        text-shadow: 0 2px 30px rgba(0, 0, 0, 0.5);
      }
      [data-theme='light'] .proc-title,
      [data-theme='light'] .proc-status { color: #0a0a0a; }
      .proc-status {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: 'Onest', 'Inter', system-ui, sans-serif;
        font-size: clamp(13px, 3.2vw, 15px);
        letter-spacing: 0.06em;
        color: rgba(255, 255, 255, 0.62);
        text-transform: uppercase;
      }
      [data-theme='light'] .proc-status { color: rgba(10, 10, 10, 0.62); }
      .proc-status::before {
        content: '';
        width: 6px; height: 6px;
        border-radius: 999px;
        background: currentColor;
        opacity: 0.5;
        animation: procPulse 1.6s ease-in-out infinite;
      }
      @keyframes procPulse { 0%,100%{opacity:.3;transform:scale(.85);} 50%{opacity:1;transform:scale(1.15);} }
      .proc-progress {
        position: relative;
        width: min(360px, 80vw);
        margin-top: 20px;
        height: 10px;
        background: radial-gradient(160% 220% at 50% -80%, rgba(255,255,255,.14), transparent 60%), rgba(6,6,8,.58);
        border-radius: 999px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.2), inset -14px -14px 8px -14px rgba(179,179,179,.32), inset 14px 14px 8px -14px rgba(179,179,179,.32);
        overflow: hidden;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .proc-bar {
        height: 100%;
        background: linear-gradient(90deg, rgba(255,255,255,.55) 0%, #fff 100%);
        border-radius: 999px;
        box-shadow: 0 0 20px rgba(255,255,255,.38);
        transition: width .4s ease;
      }

      /* ── top chrome — same markup/classes/values as the real site's
         .floating-controls--right (profile hidden in v2, account + theme
         toggle shown) so this preview reads as an actual page, not a dev
         tool. Account button is inert here (no real auth in this widget's
         sandbox); theme toggle is wired to swap dark/light + texture. ── */
      .floating-controls { position: fixed; top: 20px; right: 20px; z-index: 20; display: flex; align-items: center; gap: 16px; }
      .icon-btn {
        width: 44px; height: 44px;
        border-radius: 999px;
        display: flex; align-items: center; justify-content: center;
        background: rgba(8, 8, 10, .55);
        border: none;
        color: #fff;
        font-size: 15px;
        cursor: pointer;
        backdrop-filter: blur(18px) saturate(130%);
        -webkit-backdrop-filter: blur(18px) saturate(130%);
        box-shadow: inset -14px -14px 8px -14px rgba(179,179,179,.32), inset 14px 14px 8px -14px rgba(179,179,179,.32);
        transition: background .25s, box-shadow .25s, transform .2s;
      }
      .icon-btn:hover {
        background: rgba(18, 18, 22, .7);
        transform: translateY(-1px);
        box-shadow: inset -21.48px -21.48px 10.74px -21.48px rgba(179,179,179,.55), inset 21.48px 21.48px 10.74px -21.48px rgba(179,179,179,.55);
      }
      .icon-btn:active { transform: translateY(0) scale(.94); }
      .theme-toggle i { transition: transform 320ms cubic-bezier(0.34, 1.56, 0.64, 1); }
      .theme-toggle:hover i { transform: rotate(24deg); }
    </style>
  </head>
  <body data-theme="dark">
    <div id="sonya-cloth-root" class="sonya-cloth-host"></div>

    <div class="proc-overlay">
      <div class="proc-title">Собираем монтаж</div>
      <div class="proc-status">Обрабатываем кадры</div>
      <div class="proc-progress"><div class="proc-bar" id="proc-bar"></div></div>
    </div>

    <div class="floating-controls">
      <button class="icon-btn acct-btn" aria-label="Аккаунт" title="Превью — без реальной авторизации">
        <i class="fa-solid fa-user"></i>
      </button>
      <button class="icon-btn theme-toggle" id="theme-toggle" aria-label="Тема">
        <i class="fa-solid fa-circle-half-stroke"></i>
      </button>
    </div>

    <script type="module" src="/src/chrome-preview-main.js"></script>
  </body>
</html>
